global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    service: mlwrap

scrape_configs:
  - job_name: mlwrap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          instance: mlwrap-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

[project]
name = "mlwrap"
version = "0.1.0"
description = "FastAPI-обёртка для быстрого тестирования ML-моделей: регистрируешь загрузку, инференс и метрики — получаешь готовый сервис"
authors = [{ name = "Pavel" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "greenlet>=3.0",
]

[project.optional-dependencies]
examples = ["scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26"]

[project.scripts]
mlwrap = "mlwrap.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/mlwrap"]

[tool.pdm.scripts]
serve = "mlwrap serve --reload"
test = "pytest"
lint = "ruff check src tests"
fmt = "ruff format src tests"
typecheck = "mypy src"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008 — Depends() в значениях по умолчанию, это идиома FastAPI.
# RUF001-003 — кириллица в строках и комментариях: документация проекта на русском.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["mlwrap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
